# depth2stl as a Cut Craft add-on, in Cut Craft's shared add-on layout: each release zip
# holds this file (version filled in from the tag) and the compiled program, and Cut Craft
# unpacks it per user into <add-ons folder>/depth2stl/. Cut Craft drives the program
# through `depth2stl api` (see api.py).
id = "depth2stl"
name = "Depth to STL"
kind = "tool"
version = "@VERSION@"
api = 1
needs_cutcraft = ">=0.6.0"
platforms = ["linux-x64", "windows-x64"]
license = "LicenseRef-depth2stl"
files = ["@PROGRAM@"]
